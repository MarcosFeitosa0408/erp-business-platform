name: Publicar plataforma no GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Preparar arquivos públicos
        run: |
          mkdir _site
          cp index.html dashboard.html empresas.html dados.html importar.html style.css import.css app.js dashboard.js import-core.js import.js import-worker.js workspace-core.js workspace.js workspace-pages.js _site/
          cp -R data docs vendor _site/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deploy
